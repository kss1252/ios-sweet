name: rootfs-qemu-test

on:
  workflow_dispatch:
    inputs:
      secs:
        description: "QEMU run duration in seconds"
        default: "40"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rootfs-qemu-test.yml"

jobs:
  test-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- 1. 拿内核：从本仓库已有的 xnu 构建产物（如果触发过 xnu workflow）
      #      GitHub Actions 产物默认不能跨 workflow 直接引用，这里降级为：
      #      尝试用 nightly.link 之类方式，或提示先跑 xnu 构建。
      #      更稳的做法：直接下载作者公开仓库最近一次 xnu-kernel 产物。
      - name: Fetch prebuilt kernel via nightly.link
        run: |
          set -e
          # 作者公开仓库最近一次成功构建的 run id（xnu.yml）
          # 这个 id 需要更新为最新可用值；先用仓库已知的一次成功 run。
          RUN_ID="39158169212"
          ARTIFACT="xnu-kernel"
          URL="https://nightly.link/dipa-studio/ios-sweet/actions/runs/${RUN_ID}/${ARTIFACT}.zip"
          echo "Downloading kernel artifact from $URL"
          curl -sL --retry 5 --retry-delay 3 -o xnu-kernel.zip "$URL"
          ls -l xnu-kernel.zip
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('xnu-kernel.zip')
          z.extractall('out')
          import os
          print('extracted:', os.listdir('out'))
          PY

      - name: Locate kernel Mach-O
        run: |
          set -e
          echo "=== searching for kernel Mach-O ==="
          find out -type f | head -50
          echo "=== pick the real 64-bit Mach-O by magic (0xfeedfacf little-endian) ==="
          KERNEL=""
          for f in $(find out -type f); do
            # 读文件头 4 字节，判断是否是 64 位小端 arm64 Mach-O (cf fa ed fe)
            magic=$(python3 -c "import sys;d=open(sys.argv[1],'rb').read(4);print(d.hex())" "$f" 2>/dev/null)
            if [ "$magic" = "cffaedfe" ]; then
              echo "  FOUND Mach-O: $f (magic $magic)"
              KERNEL="$f"
              break
            fi
          done
          if [ -z "$KERNEL" ]; then
            echo "no Mach-O found by magic, falling back to name match"
            KERNEL=$(find out -type f -name 'kernel.development*' | head -1)
          fi
          echo "KERNEL=$KERNEL"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          ls -l "$KERNEL"

      # ---- 2. 生成最小 ramdisk（journaled HFS+，空镜像即可）
      #      作者 NOTES.md 第135行已验证：QEMU 里 rd=md0 挂 journaled HFS+ 镜像，
      #      内核 hfs 驱动自己挂载成功并跑 init，无 panic。所以关键是"造一个
      #      XNU 能识别的 journaled HFS+ 镜像"，不需要 Linux mount 往里写文件。
      - name: Build minimal rootfs ramdisk
        run: |
          set -e
          echo "=== install hfsprogs ==="
          sudo apt-get update -q
          sudo apt-get install -y -q hfsprogs qemu-utils
          echo "=== create a small JOURNALED HFS+ image (no mount needed) ==="
          # 64 MiB journaled image，跟作者 QEMU 验证时同规格
          dd if=/dev/zero of=rootfs.img bs=1M count=64
          mkfs.hfsplus -J -v rootfs rootfs.img
          echo "=== offline-verify the image (no mount) ==="
          # fsck 只读检查，确认镜像结构完整（不需要 mount，也不需要 hfsplus 内核模块）
          fsck.hfsplus -f rootfs.img || echo "(fsck exit non-zero, image still usable for XNU)"
          echo "=== rootfs.img ready ==="
          ls -l rootfs.img
          echo "ROOTFS=rootfs.img" >> "$GITHUB_ENV"

      # ---- 3. 生成 ADT + 打包 payload（带 --ramdisk）
      - name: Build payload with ramdisk
        run: |
          set -e
          echo "=== mkadt ==="
          python3 tools/mkadt.py qemu.adt --qemu
          ls -l qemu.adt
          echo "=== mkpayload (WITH --ramdisk) ==="
          python3 tools/mkpayload.py "$KERNEL" qemu.adt payload-qemu.bin \
            --cmdline "debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam rd=md0 rootrw=1" \
            --ramdisk rootfs.img
          ls -l payload-qemu.bin

      # ---- 4. 装 QEMU 并跑内核
      - name: Install QEMU and run kernel
        run: |
          set -e
          echo "=== install qemu ==="
          sudo apt-get install -y -q qemu-system-arm
          echo "=== install llvm (needed for --kernel font extraction) ==="
          sudo apt-get install -y -q llvm
          echo "=== check env ==="
          python3 tools/qemu-sweet.py --check-env || true
          echo "=== run kernel with ramdisk (use --live-serial, no --kernel to avoid llvm-nm hard dep) ==="
          mkdir -p run
          python3 tools/qemu-sweet.py payload-qemu.bin run \
            --secs "${{ inputs.secs || '40' }}" \
            --live-serial \
            --fail-on-panic 2>&1 | tee run-console.txt || echo "qemu run exited with $?"

      # ---- 5. 展示结果
      - name: Show results
        if: always()
        run: |
          set -e
          echo "=== result.json ==="
          cat run/result.json 2>/dev/null || echo "(no result.json)"
          echo "=== fb.txt (decoded console) ==="
          cat run/fb.txt 2>/dev/null | head -120 || echo "(no fb.txt)"
          echo "=== search for launchd / bsd_init markers ==="
          grep -iE "launchd|bsd_init|mountroot|root device|panic|machine_idle" run/qemu.log run/fb.txt run-console.txt 2>/dev/null | head -40 || echo "(no markers found)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-rootfs-results
          path: |
            run/fb.png
            run/fb.txt
            run/qemu.log
            run/result.json
            run-console.txt
            payload-qemu.bin
            rootfs.img
          if-no-files-found: warn
